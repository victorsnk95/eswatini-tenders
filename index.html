<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandile Tender Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--card:#fff;--tx:#14181f;--mu:#5d6675;--bd:#e3dfd3;--blue:#3e5eb9;--onb:#fff;--yel:#ffd900;--red:#b10c0c;--ok:#0f8a4f;--warn:#c76a00;--hl:#fff6cf;--sh:0 1px 2px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#18213a;--tx:#eef1f8;--mu:#9aa6c0;--bd:#26314f;--blue:#7b97ee;--onb:#0d1220;--red:#ff7a7a;--ok:#4cd694;--warn:#ffa84d;--hl:#2d2b15;--sh:none}}:root[data-theme="dark"]{--bg:#0d1220;--card:#18213a;--tx:#eef1f8;--mu:#9aa6c0;--bd:#26314f;--blue:#7b97ee;--onb:#0d1220;--red:#ff7a7a;--ok:#4cd694;--warn:#ffa84d;--hl:#2d2b15;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 Inter,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom,0px)}
.flag{height:6px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--yel) 34% 66%,#b10c0c 66%)}
.wrap{max-width:1180px;margin:auto;padding:0 16px 40px}
.hero{padding:calc(20px + env(safe-area-inset-top,0px)) 0 6px}
h1{font-size:clamp(1.8rem,5.5vw,2.8rem);font-weight:850;letter-spacing:-.02em;margin:0;line-height:1.08}
h1 span{background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mu);margin:4px 0 0}.live{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.85rem;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.st{font:inherit;color:var(--tx);text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);cursor:pointer}
.st.static{cursor:default}.st.on{border-color:var(--blue)}
.st b{display:block;font-size:2rem;line-height:1.1;font-weight:800}.st small{color:var(--mu)}
.st.new b{color:#e11d48}.st.soon b{color:var(--warn)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:20px 0 8px}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.hd{flex:0 0 30px;background:none;border:0;padding:0;cursor:pointer;color:var(--mu);font:inherit;font-size:.68rem;text-align:center}
.bar{display:flex;align-items:flex-end;height:58px}.bar i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--bd)}
.hd.has .bar i{background:var(--blue)}.hd.near.has .bar i{background:var(--warn)}.hd.on .bar i{background:var(--yel)}
.hd b{display:block;margin-top:2px;color:var(--tx)}.hd.today b{color:var(--red)}.hd small{display:block;min-height:1em}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
input[type=search]{flex:1;min-width:200px;padding:10px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--card);color:var(--tx);padding:9px 14px;cursor:pointer}.seg button.on{background:var(--blue);color:var(--onb)}
label.ck{font-size:.85rem;color:var(--mu);display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip b{opacity:.6;margin-left:4px}.chip.on{background:var(--blue);border-color:var(--blue);color:var(--onb)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;align-items:start;margin-top:12px}
.ln h3{margin:0;font-size:1.05rem;display:flex;gap:8px;align-items:center}.ln h3 span{font-size:.75rem;background:var(--bd);border-radius:99px;padding:0 9px;color:var(--tx)}
.ln>p{margin:0 0 8px;color:var(--mu);font-size:.8rem}.l-s h3{color:var(--red)}.l-f h3{color:#e11d48}
.stack .ln{margin-top:18px}.stack{max-width:820px}
.c{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.c.p3{border-left-color:var(--red)}.c.p2{border-left-color:var(--warn)}.c.p1{border-left-color:var(--yel)}.c.fresh{background:var(--hl)}
.ti{color:var(--tx);font-weight:650;text-decoration:none}.ti:hover{color:var(--blue);text-decoration:underline}
.en{font-size:.86rem;color:var(--mu);margin:2px 0 6px}
.mt,.ft{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--mu)}.ft{margin-top:6px;justify-content:space-between}
.pill,.nw,.rs{padding:1px 9px;border-radius:99px;font-size:.74rem;font-weight:700}
.pill.p3{background:var(--red);color:#fff}.pill.p2{background:var(--warn);color:#fff}.pill.p1{background:var(--yel);color:#3a3000}.pill.p0{border:1px solid var(--bd);color:var(--mu)}
.nw{background:#e11d48;color:#fff}.rs{border:1px solid var(--warn);color:var(--warn)}
.dl{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
.more{width:100%;padding:9px;border:1px dashed var(--bd);background:none;color:var(--mu);border-radius:10px;cursor:pointer;font:inherit}
.empty{text-align:center;color:var(--mu);padding:50px 10px}.src{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.src span{border:1px solid var(--bd);border-radius:99px;padding:2px 10px;background:var(--card)}.src .ok:before{content:"● ";color:var(--ok)}.src .idle:before{content:"● ";color:var(--mu)}.src .bad:before{content:"● ";color:var(--red)}

.hero{position:relative;border:1px solid var(--bd);border-radius:22px;margin-top:14px;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 18px;overflow:hidden;background:radial-gradient(520px 200px at 8% 0%,rgba(62,94,185,.38),transparent 70%),radial-gradient(420px 200px at 92% 8%,rgba(255,217,0,.30),transparent 70%),radial-gradient(460px 220px at 55% 130%,rgba(177,12,12,.28),transparent 70%),var(--card)}
.hi{font-size:.95rem;color:var(--mu);margin-bottom:2px}
.tg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.1rem;cursor:pointer}
.tick{display:flex;align-items:stretch;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:14px 0 0;overflow:hidden}
.tick>b{flex:none;background:var(--red);color:#fff;padding:8px 13px;font-size:.74rem;letter-spacing:.06em;display:flex;align-items:center}
.tkw{overflow:hidden;flex:1;white-space:nowrap;display:flex;align-items:center}
.tk{display:inline-block;padding-left:100%;animation:mq 50s linear infinite}.tick:hover .tk{animation-play-state:paused}
.tk span{margin-right:38px;font-size:.86rem}.tk em{font-style:normal;font-weight:800;color:var(--warn)}.tk small{color:var(--mu)}
@keyframes mq{to{transform:translateX(-100%)}}
.c{transition:transform .15s,box-shadow .15s;animation:rise .4s both;animation-delay:calc(var(--i,0)*35ms)}
.c:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.16)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}.noanim .c{animation:none}
.c.watch{outline:2px solid #a855f7aa}
.hd2{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.sv{flex:none;background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--mu);opacity:.45;padding:0 2px;transition:transform .15s,opacity .15s}
.sv:hover{transform:scale(1.25);opacity:1}.sv.on{color:#f5b700;opacity:1;text-shadow:0 0 12px rgba(255,200,0,.7)}
.ft span:last-child{display:flex;gap:10px;align-items:center}
.ic{font:inherit;background:none;border:1px solid var(--bd);border-radius:8px;padding:2px 9px;cursor:pointer;color:var(--tx);font-size:.76rem}.ic:hover{border-color:var(--blue)}
.nw{background:linear-gradient(90deg,#e11d48,#ff5c8a,#e11d48);background-size:200% 100%;animation:sh 3s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.mch{background:linear-gradient(90deg,#7c3aed,#c026d3);color:#fff;padding:1px 9px;border-radius:99px;font-size:.74rem;font-weight:700}
.st{transition:transform .15s}.st:not(.static):hover{transform:translateY(-3px)}.st.sav b{color:#d99a00}.st.mat b{color:#a855f7}
#wt{width:100%;padding:10px 13px;border:1px dashed #a855f7;border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:10px 0 2px}
.cats{margin-top:8px}.chip.cp{border-style:dashed}
@media(prefers-reduced-motion:reduce){.tk,.nw,.c{animation:none}.tk{padding-left:0}.tkw{overflow-x:auto}}

h1,h2,h3,.st b,.dg b{font-family:Sora,Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40vmax 40vmax at 8% 0%,rgba(62,94,185,.24),transparent 60%),radial-gradient(34vmax 34vmax at 100% 18%,rgba(255,217,0,.15),transparent 60%),radial-gradient(40vmax 40vmax at 40% 110%,rgba(177,12,12,.15),transparent 60%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(2%,3%) scale(1.08)}}
.bar2{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:10px 6px;margin:10px -6px 4px;backdrop-filter:blur(14px) saturate(1.4);background:color-mix(in srgb,var(--bg) 80%,transparent);border-radius:14px}
.kb{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;padding:9px 12px;cursor:pointer}
.c{cursor:pointer;position:relative;overflow:hidden}.c::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--blue) 18%,transparent),transparent 60%)}.c:hover::before{opacity:1}
.sv.pop{animation:pop .45s}@keyframes pop{40%{transform:scale(1.7) rotate(-14deg)}}
.sk{height:96px;border-radius:12px;margin:10px 0;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1.4s linear infinite}
.spot{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:16px 20px;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(120deg,#1d2f6b,#6b1230);border:1px solid rgba(255,255,255,.14)}
.spot small{opacity:.75;letter-spacing:.08em;font-size:.72rem}.spot h3{margin:2px 0;font-size:1.1rem}.spot>div:first-child span{opacity:.8;font-size:.86rem}
.dg{display:flex;gap:8px}.dg div{background:rgba(255,255,255,.13);border-radius:12px;padding:6px 10px;text-align:center;min-width:58px}.dg b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}.dg small{font-size:.62rem}
.sc{position:fixed;inset:0;background:rgba(5,8,18,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}.sc.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--card);border-left:1px solid var(--bd);z-index:60;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25)}.dr.on{transform:none}
.dr h3{margin:8px 0 2px}.x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer}
.ring{text-align:center}.dr dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.88rem}.dr dt{color:var(--mu)}.dr dd{margin:0;word-break:break-word}.dr h4{margin:18px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;font-size:.88rem}.btn.pri{background:var(--blue);color:var(--onb);border-color:var(--blue);font-weight:700}
.sim{padding:9px 11px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:.88rem}.sim small{display:block;color:var(--mu)}.sim:hover{border-color:var(--blue)}
.pl{position:fixed;inset:0;z-index:70;background:rgba(5,8,18,.55);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:12vh 14px}.pl.on{display:flex}
.pb{width:min(640px,100%);background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.pb input{width:100%;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;font-size:1.05rem;padding:16px 18px;outline:none}
#pr{max-height:50vh;overflow:auto;padding:6px}.pi{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}.pi.on,.pi:hover{background:color-mix(in srgb,var(--blue) 16%,transparent)}.pi small{display:block;color:var(--mu)}.pi b{font-weight:600}
.ts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:80}.ts.on{opacity:1;transform:translate(-50%,0)}
.calh{display:flex;gap:10px;align-items:center;margin:8px 0}.calh h3{margin:0;flex:1;text-align:center}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dw{text-align:center;font-size:.72rem;color:var(--mu);text-transform:uppercase}
.cl{min-height:92px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;position:relative;overflow:hidden}.cl.off{background:none;border:0}.cl.td{outline:2px solid var(--blue)}.num{font-size:.78rem;color:var(--mu);font-weight:700}
.cn{position:absolute;top:4px;right:4px;border:0;background:var(--blue);color:var(--onb);border-radius:99px;min-width:20px;height:20px;font-size:.7rem;font-weight:700;cursor:pointer}
.ce{font-size:.68rem;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--bd)}.ce.p3{background:var(--red);color:#fff}.ce.p2{background:var(--warn);color:#fff}.ce.p1{background:var(--yel);color:#3a3000}.cl small{font-size:.65rem;color:var(--mu)}
@media(max-width:640px){.cc{display:none}.cl{min-height:54px}}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:12px}.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}.pn h3{margin:0 0 12px;font-size:1rem}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn ul{list-style:none;margin:0;padding:0;font-size:.82rem}.dn li{margin:3px 0}.dn li i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.ob{display:grid;grid-template-columns:130px 1fr 24px;gap:8px;align-items:center;font-size:.8rem;margin:7px 0;cursor:pointer}.ob span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ob i{display:block;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--red))}
.sp{display:flex;gap:4px;height:130px}.sp div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mu)}.sp i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:linear-gradient(var(--blue),var(--red))}

.ws{position:fixed;inset:0;z-index:65;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:wsin .25s}
.ws.on{display:flex}body.wso{overflow:hidden}@keyframes wsin{from{opacity:0;transform:scale(.985)}}
.wh{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
.wh h2{margin:0;font-size:1.15rem;text-transform:none;letter-spacing:0;color:var(--tx)}.wh .sp1{flex:1}
.wcnt{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem}.wcnt span{border-radius:99px;padding:2px 10px;color:#fff;font-weight:600}
.wurg{font-size:.82rem;color:var(--red);font-weight:700}
.wb{flex:1;display:grid;grid-template-columns:1fr 410px;min-height:0}
.wc{display:flex;flex-direction:column;padding:14px;min-height:0}.wnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}.wnav h3{margin:0;flex:1;text-align:center;font-size:1.25rem}
.wdw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px;text-align:center;font-size:.72rem;color:var(--mu);text-transform:uppercase}
.wg{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr);gap:6px;min-height:0}
.wd{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 6px;overflow:hidden;min-height:0}.wd.off{background:none;border:0}.wd.td{outline:2px solid var(--blue)}.wd>b{font-size:.78rem;color:var(--mu)}.wd small{font-size:.65rem;color:var(--mu)}
.wch{font-size:.7rem;border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff;border:2px solid transparent}.wch.sel{border-color:var(--yel)}
.s-todo{background:#3e5eb9}.s-prep{background:#c76a00}.s-ready{background:#7c3aed}.s-sub{background:#0f8a4f}.s-miss{background:#b10c0c}.s-drop{background:var(--bd);color:var(--mu)!important;text-decoration:line-through}
.wside{border-left:1px solid var(--bd);overflow:auto;padding:14px;background:var(--card)}
.wdt{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--bg)}.wdt h3{margin:0 0 2px;font-size:1.02rem}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.stg button{font:inherit;font-size:.78rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 11px;cursor:pointer}.stg button.on{background:var(--blue);color:var(--onb);border-color:var(--blue);font-weight:700}
.pg{height:7px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#10b981);transition:width .4s}.pg.big{height:11px}
.chk{list-style:none;margin:12px 0;padding:0}.chk li{margin:6px 0;font-size:.88rem}.chk input{margin-right:8px;width:16px;height:16px;vertical-align:-3px}
#wsn{width:100%;min-height:80px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;padding:9px;resize:vertical}.btn.ok{background:#0f8a4f;color:#fff;border-color:#0f8a4f}
.wi{border:1px solid var(--bd);border-radius:12px;padding:9px 11px;margin-bottom:8px;cursor:pointer;background:var(--bg)}.wi.on{border-color:var(--yel);box-shadow:0 0 0 2px rgba(255,217,0,.35)}.wit{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:600}.wi small{color:var(--mu)}
.wsb{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:14px 18px;margin:8px 0 14px;color:#fff;background:linear-gradient(120deg,#1d2f6b,#7c3aed)}.wsb small{display:block;opacity:.85}.wsb .btn{background:#fff;color:#1d2f6b;border:0}
@media(max-width:860px){.wb{grid-template-columns:1fr;overflow:auto;display:block}.wg{min-height:62vh}.wside{border-left:0;border-top:1px solid var(--bd);overflow:visible}.wch{font-size:.6rem}}

@page{size:A4 landscape;margin:10mm}
#prs{display:none}
@media print{

{const th=ST.get('theme',null);if(th)document.documentElement.dataset.theme=th}

function ring(t){const d=dleft(t),c=2*Math.PI*52,pr=d===null?0:Math.max(0,Math.min(1,1-d/30)),col=d===null?'var(--mu)':d<=3?'var(--red)':d<=7?'var(--warn)':'var(--blue)';
  return `<svg viewBox="0 0 120 120" width="132" height="132"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*pr} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="var(--tx)">${d===null?'—':Math.max(0,d)}</text><text x="60" y="80" text-anchor="middle" font-size="11" fill="var(--mu)">${d===null?'see notice':d===1?'day left':'days left'}</text></svg>`}
function openDr(id){const t=T.find(x=>x.id===id);if(!t)return;DR=id;
  const sim=T.filter(x=>x.id!==id&&x.status==='open'&&(org(x)===org(t)||catOf(x)===catOf(t))).sort(byClose).slice(0,4),row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  $('dr').innerHTML=`<button class="x" data-close="1" aria-label="Close">✕</button><div class="ring">${ring(t)}</div><h3>${esc(t.title)}</h3><p class="en">${esc(org(t))} · ${catIcon(t)} ${catOf(t)}</p>
  <div class="acts"><a class="btn pri" href="${esc(t.url)}" target="_blank" rel="noopener">Open original ↗</a><button class="btn" data-save="${esc(t.id)}">${SAVED.has(t.id)?'★ Saved':'☆ Save'}</button>${t.closing&&dleft(t)>=0?`<button class="btn" data-ics="${esc(t.id)}">📅 Remind me</button>`:''}<button class="btn" data-share="${esc(t.id)}">🔗 Share</button></div>
  <dl>${row('Closes',t.closing_text||t.closing)}${row('Reference',t.reference)}${row('Method',t.method)}${row('Type',t.type)}${row('First spotted',t.first_seen?new Date(t.first_seen).toDateString():'')}${row('Posted',t.posted)}${row('Source',t.source)}</dl>
  ${sim.length?`<h4>Similar tenders</h4>${sim.map(x=>`<div class="sim" data-id="${esc(x.id)}">${esc(x.title)}<small>${esc(org(x))} · ${pill(x)[0]}</small></div>`).join('')}`:''}`;
  $('dr').classList.add('on');$('sc').classList.add('on');$('dr').scrollTop=0}
function closeDr(){DR=null;$('dr').classList.remove('on');$('sc').classList.remove('on')}
function shareT(id){const t=T.find(x=>x.id===id);if(!t)return;const txt=`${t.title} | ${org(t)} | ${t.closing_text||t.closing||'see notice'}`;
  if(navigator.share)navigator.share({title:t.title,text:txt,url:t.url}).catch(()=>{});else{try{navigator.clipboard.writeText(txt+'\n'+t.url).then(()=>toast('🔗 Copied to clipboard'))}catch{}}}
function calendar(){const r=rows(),now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+S.cm,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),by={};
  r.forEach(t=>{if(t.closing)(by[t.closing]=by[t.closing]||[]).push(t)});
  let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="cl off"></div>';
  for(let n=1;n<=last.getDate();n++){const k=iso(new Date(first.getFullYear(),first.getMonth(),n)),a=(by[k]||[]).sort(byClose);
    cells+=`<div class="cl${k===iso(now)?' td':''}"><span class="num">${n}</span>${a.length?`<button class="cn" data-day="${k}" title="Show these ${a.length}">${a.length}</button>`:''}<div class="cc">${a.slice(0,3).map(t=>`<div class="ce ${pill(t)[1]}" data-id="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}${a.length>3?`<small>+${a.length-3} more</small>`:''}</div></div>`}
  return `<div class="calh"><button class="chip" data-cm="-1">‹</button><h3>${first.toLocaleString('en',{month:'long',year:'numeric'})}</h3><button class="chip" data-cm="1">›</button><button class="chip" data-cm="${-S.cm}">Today</button></div><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dw">${x}</div>`).join('')}${cells}</div>`}
const PAL=['#3e5eb9','#ffd900','#e11d48','#10b981','#a855f7','#f97316','#06b6d4','#84cc16','#94a3b8'];
function insights(){const L=live(),cc={},oc={};L.forEach(t=>{cc[catOf(t)]=(cc[catOf(t)]||0)+1;oc[org(t)]=(oc[org(t)]||0)+1});
  const ce=Object.entries(cc).sort((a,b)=>b[1]-a[1]);let off=25;
  const donut=ce.map(([k,n],i)=>{const p=n/L.length*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i%9]}" stroke-width="5.5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
  const oe=Object.entries(oc).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=oe.length?oe[0][1]:1;
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);const k=iso(d);return[d,L.filter(t=>iso(new Date(t.first_seen))===k).length]}),dm=Math.max(1,...days.map(x=>x[1]));
  return `<div class="ins"><div class="pn"><h3>Tender mix</h3><div class="dn"><svg viewBox="0 0 42 42" width="170" height="170"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="5.5"/>${donut}<text x="21" y="22.6" text-anchor="middle" font-size="7" font-weight="800" fill="var(--tx)">${L.length}</text></svg><ul>${ce.map(([k,n],i)=>`<li><i style="background:${PAL[i%9]}"></i>${CATS.find(c=>c[0]===k)[1]} ${k} · <b>${n}</b></li>`).join('')}</ul></div></div>
  <div class="pn"><h3>Busiest organisations</h3>${oe.map(([o,n])=>`<div class="ob" data-org="${esc(o)}" title="Show ${esc(o)}"><span>${esc(o)}</span><i style="width:${n/mx*100}%"></i><b>${n}</b></div>`).join('')}</div>
  <div class="pn"><h3>New tenders per day · last 14 days</h3><div class="sp">${days.map(([d,n])=>`<div title="${n} new on ${iso(d)}"><i style="height:${n/dm*92}%"></i>${d.getDate()}</div>`).join('')}</div></div></div>`}
function openPal(){$('pl').classList.add('on');$('pq').value='';PI=0;palRender();$('pq').focus()}
function closePal(){$('pl').classList.remove('on')}
function palRender(){const q=$('pq').value.toLowerCase().trim(),has=s=>!q||s.toLowerCase().includes(q),L=[];
  [['🗓️','Open my tender workspace',()=>openWs()],['🖨️','Print my tender summary',()=>printSummary()],['🗂️','Board view',()=>S.view='board'],['📋','List view',()=>S.view='list'],['📅','Calendar view',()=>S.view='cal'],['📊','Insights',()=>S.view='ins'],['★','Show my saved tenders',()=>{S.mode='saved';S.view='board'}],['⏰','Closing this week',()=>{S.mode='soon';S.view='board'}],['✨','New tenders',()=>{S.mode='new';S.view='board'}],['🌗','Switch light / dark',setTheme],['↺','Clear all filters',clearF]].filter(a=>has(a[1])).forEach(a=>L.push({i:a[0],t:a[1],s:'Action',run:a[2]}));
  if(q){[...new Set(live().map(org))].filter(has).slice(0,4).forEach(o=>L.push({i:'🏢',t:o,s:'Filter by organisation',run:()=>{S.org=o;if(S.view==='ins'||S.view==='cal')S.view='board'}}));
    CATS.filter(c=>c[0]!=='Other'&&has(c[0])).slice(0,3).forEach(c=>L.push({i:c[1],t:c[0],s:'Filter by type',run:()=>{S.cat=c[0];if(S.view==='ins'||S.view==='cal')S.view='board'}}));
    live().filter(t=>has(t.title+' '+org(t)+' '+(t.reference||''))).slice(0,8).forEach(t=>L.push({i:'📄',t:t.title,s:org(t)+' · '+pill(t)[0],run:()=>openDr(t.id),keep:1}))}
  PL=L;PI=Math.min(PI,Math.max(0,L.length-1));
  $('pr').innerHTML=L.length?L.map((x,i)=>`<div class="pi${i===PI?' on':''}" data-pi="${i}"><span>${x.i}</span><div><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div></div>`).join(''):'<div class="empty">No matches</div>'}
function palRun(i){const x=PL[i];if(!x)return;closePal();x.run();render(!!x.keep)}

let WORK=ST.get('work',{}),WS={cm:0,sel:null};
const STG=[['todo','Not started'],['prep','Preparing'],['ready','Ready to submit'],['sub','Submitted ✓'],['drop','Not bidding']];
const CHK=['Read the full tender document','Check eligibility and requirements','Tax clearance and compliance certificates','Company profile and references','Price the bid (BOQ or quotation)','Prepare the technical proposal','Final review of the whole bid','Deliver or upload before the deadline'];
const wk=id=>WORK[id]||(WORK[id]={st:'todo',chk:[],note:''}),wsave=()=>ST.set('work',WORK);
const mine=()=>T.filter(t=>SAVED.has(t.id)).sort(byClose);
const wprog=id=>{const w=WORK[id];return w?Math.round(CHK.filter((_,i)=>w.chk[i]).length/CHK.length*100):0};
const wstat=t=>{const w=WORK[t.id]||{st:'todo'};if(w.st==='sub'||w.st==='drop')return w.st;const d=dleft(t);return d!==null&&d<0?'miss':w.st};
function autoStage(w){if(w.st==='drop')return;const n=CHK.filter((_,i)=>w.chk[i]).length,pre=CHK.slice(0,-1).filter((_,i)=>w.chk[i]).length;
  if(n===CHK.length){w.st='sub';w.sub=iso(new Date())}else w.st=pre===CHK.length-1?'ready':n>0?'prep':'todo'}
function openWs(id){const L=mine(),pick=L.find(t=>!['sub','drop'].includes(wstat(t))&&dleft(t)!==null&&dleft(t)>=0)||L.find(t=>!['sub','drop'].includes(wstat(t)))||L[0];
  WS.sel=id||(pick&&pick.id)||null;const t=L.find(x=>x.id===WS.sel);WS.cm=0;
  if(t&&t.closing){const a=new Date(),c=new Date(t.closing+'T00:00:00');WS.cm=(c.getFullYear()-a.getFullYear())*12+c.getMonth()-a.getMonth()}
  $('ws').classList.add('on');document.body.classList.add('wso');wsRender()}
function closeWs(){$('ws').classList.remove('on');document.body.classList.remove('wso');render(true)}
function wsDetail(t){const w=WORK[t.id]||{st:'todo',chk:[],note:''},p=wprog(t.id),s=wstat(t),d=dleft(t);
  const state=s==='sub'?`Submitted${w.sub?' on '+w.sub:''} ✓`:s==='miss'?'Deadline passed, not submitted':s==='drop'?'Not bidding':d===null?'See notice for the deadline':d===0?'Closes today':`${d} day${d===1?'':'s'} left`;
  return `<div class="wdt"><h3>${esc(t.title)}</h3><p class="en">${esc(org(t))} · ${esc(t.closing_text||t.closing||'deadline in notice')}</p>
  <div class="stg">${STG.map(([k,l])=>`<button class="${w.st===k?'on':''}" data-wsst="${k}">${l}</button>`).join('')}</div>
  <div class="pg big"><i style="width:${p}%"></i></div><small>${p}% complete · <b>${state}</b></small>
  <ul class="chk">${CHK.map((c,i)=>`<li><label><input type="checkbox" data-wsck="${i}" ${w.chk[i]?'checked':''}>${c}</label></li>`).join('')}</ul>
  <textarea id="wsn" placeholder="Notes: contacts, prices, things to remember…">${esc(w.note||'')}</textarea>
  <div class="acts"><a class="btn pri" href="${esc(t.url)}" target="_blank" rel="noopener">Open original ↗</a>${t.closing&&d>=0?`<button class="btn" data-ics="${esc(t.id)}">📅 Remind me</button>`:''}${s!=='sub'?'<button class="btn ok" data-wsst="sub">✓ Mark submitted</button>':''}</div></div>`}
function wsRender(){const L=mine(),now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+WS.cm,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),by={},cnt={todo:0,prep:0,ready:0,sub:0,miss:0};
  L.forEach(t=>{if(t.closing)(by[t.closing]=by[t.closing]||[]).push(t);const s=wstat(t);if(cnt[s]!==undefined)cnt[s]++});
  const urg=L.filter(t=>['todo','prep','ready'].includes(wstat(t))&&dleft(t)!==null&&dleft(t)<=3).length;
  let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="wd off"></div>';
  for(let n=1;n<=last.getDate();n++){const k=iso(new Date(first.getFullYear(),first.getMonth(),n)),a=by[k]||[];
    cells+=`<div class="wd${k===iso(now)?' td':''}"><b>${n}</b>${a.slice(0,4).map(t=>`<div class="wch s-${wstat(t)}${WS.sel===t.id?' sel':''}" data-ws="${esc(t.id)}" title="${esc(t.title)}">${wstat(t)==='sub'?'✓ ':''}${esc(t.title)}</div>`).join('')}${a.length>4?`<small>+${a.length-4} more</small>`:''}</div>`}
  const sel=L.find(t=>t.id===WS.sel),C=[['todo','Not started','#3e5eb9'],['prep','Preparing','#c76a00'],['ready','Ready','#7c3aed'],['sub','Submitted','#0f8a4f'],['miss','Missed','#b10c0c']];
  $('ws').innerHTML=`<div class="wh"><h2>🗓️ My Tender Workspace</h2><div class="wcnt">${C.filter(c=>cnt[c[0]]).map(c=>`<span style="background:${c[2]}">${cnt[c[0]]} ${c[1]}</span>`).join('')}</div>${urg?`<span class="wurg">⚠️ ${urg} closing within 3 days and not submitted</span>`:''}<span class="sp1"></span><button class="btn" data-wsprint="1">🖨️ Print summary</button><button class="btn" data-wsclose="1">✕ Close (Esc)</button></div>
  <div class="wb"><div class="wc"><div class="wnav"><button class="chip" data-wscm="-1">‹</button><h3>${first.toLocaleString('en',{month:'long',year:'numeric'})}</h3><button class="chip" data-wscm="1">›</button><button class="chip" data-wscm="today">Today</button></div>
  <div class="wdw">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div><div class="wg">${cells}</div></div>
  <div class="wside">${L.length?(sel?wsDetail(sel):'')+`<h4 style="margin:6px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)">All saved tenders (${L.length})</h4>`+L.map(t=>`<div class="wi${WS.sel===t.id?' on':''}" data-ws="${esc(t.id)}"><div class="wit"><span>${esc(t.title)}</span><span class="pill ${wstat(t)==='sub'?'p0':pill(t)[1]}">${wstat(t)==='sub'?'submitted':pill(t)[0]}</span></div><small>${esc(org(t))}${t.closing?'':' · no deadline on listing'}</small><div class="pg"><i style="width:${wprog(t.id)}%"></i></div></div>`).join(''):'<div class="empty"><h3>★ Nothing saved yet</h3>Close this window and tap the star on a tender. It will appear here, on the calendar, ready for tracking.</div>'}</div></div>`}
$('ws').addEventListener('click',e=>{const b=e.target.closest('[data-ws],[data-wsst],[data-wsclose],[data-wscm],[data-wsprint]');if(!b)return;const d=b.dataset;
  if('wsprint' in d){printSummary();return}if('wsclose' in d){closeWs();return}
  if('wscm' in d){WS.cm=d.wscm==='today'?0:WS.cm+(+d.wscm);wsRender();return}
  if('wsst' in d&&WS.sel){const w=wk(WS.sel);w.st=d.wsst;if(d.wsst==='sub'){w.sub=iso(new Date());CHK.forEach((_,i)=>w.chk[i]=true);toast('🎉 Marked as submitted. Well done!')}wsave();wsRender();return}
  if('ws' in d){WS.sel=d.ws;wsRender()}});
$('ws').addEventListener('change',e=>{const c=e.target.closest('[data-wsck]');if(!c||!WS.sel)return;const w=wk(WS.sel);w.chk[+c.dataset.wsck]=c.checked;autoStage(w);wsave();wsRender()});
$('ws').addEventListener('input',e=>{if(e.target.id==='wsn'&&WS.sel){wk(WS.sel).note=e.target.value;wsave()}});

const rk=t=>{const s=wstat(t);return s==='sub'?1:s==='drop'?2:0};
const SL={todo:'Not started',prep:'Preparing',ready:'Ready',sub:'Submitted',miss:'Missed',drop:'Not bidding'};
function buildPrs(){const L=mine().sort((a,b)=>rk(a)-rk(b)||byClose(a,b)),n=L.length,act=L.filter(t=>rk(t)===0),nx=act.find(t=>dleft(t)!==null&&dleft(t)>=0),cnt={};
  L.forEach(t=>{const s=wstat(t);cnt[s]=(cnt[s]||0)+1});
  const rowsH=L.map((t,i)=>{const w=WORK[t.id]||{chk:[],note:''},s=wstat(t),p=wprog(t.id),d=dleft(t),off=s==='sub'||s==='drop';
    return `<tr class="${rk(t)?'dim':''}"><td>${i+1}</td><td><b>${esc(t.title)}</b><small>${esc(org(t))}</small></td><td>${esc(t.reference||'')}</td><td>${esc(t.closing_text||t.closing||'See notice')}</td><td>${s==='sub'?'✓':d===null?'—':d<0?'passed':d}</td><td><span class="stp s-${s}">${SL[s]}</span></td><td><div class="ppg"><i style="width:${p}%"></i></div>${p}%</td><td>${off?'—':esc(CHK.find((_,j)=>!w.chk[j])||'')}${w.note?`<small><i>Note: ${esc(w.note.slice(0,90))}</i></small>`:''}</td></tr>`}).join('');
  $('prs').innerHTML=`<div class="pr${n>24?' xs':n>16?' sm':''}"><div class="prh"><div><h1>Sandile Tender Tracker</h1><p>My tender summary · ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>${nx?`<p><b>Next deadline:</b> ${esc(nx.title)} (${esc(nx.closing_text||nx.closing)})</p>`:''}</div>
  <div class="prk">${Object.keys(SL).filter(k=>cnt[k]).map(k=>`<span>${cnt[k]} ${SL[k]}</span>`).join('')}</div></div>
  ${n?`<table><thead><tr><th>#</th><th>Tender and organisation</th><th>Ref</th><th>Closes</th><th>Days left</th><th>Stage</th><th>Progress</th><th>Next step</th></tr></thead><tbody>${rowsH}</tbody></table>`:'<p>No saved tenders yet. Tap the star on a tender to add it to your summary.</p>'}
  <p class="prf">Verify every detail on the original tender notice before submitting. Printed from your Tender Tracker.</p></div>`}
function printSummary(){buildPrs();window.print()}
window.addEventListener('beforeprint',buildPrs);
load(true);setInterval(tick,30000);setInterval(spotTick,1000);setInterval(load,300000);
</script></body></html>
