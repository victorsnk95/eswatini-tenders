<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eswatini Tender Tracker</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2420;--mu:#667069;--ac:#0b6b3a;--bd:#e2e0d8;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--tx:#eceee9;--mu:#9aa49c;--ac:#4cc783;--bd:#2d352f;--warn:#f0a85a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header,main{max-width:900px;margin:auto;padding:16px}h1{margin:8px 0 2px;font-size:1.5rem}
.sub{color:var(--mu);font-size:.85rem}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input,select{padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input{flex:1;min-width:180px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card a{color:var(--tx);font-weight:600;text-decoration:none}.card a:hover{color:var(--ac)}
.meta{color:var(--mu);font-size:.82rem;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.tag{padding:1px 8px;border-radius:99px;font-size:.75rem;border:1px solid var(--ac);color:var(--ac)}.tag.s{border-color:var(--warn);color:var(--warn)}
</style></head><body>
<header><h1>🇸🇿 Eswatini Tender Tracker</h1>
<div class="sub" id="upd">Loading…</div>
<div class="bar"><input id="q" placeholder="Search tenders…">
<select id="st"><option value="">Open &amp; new</option><option value="new">New today</option><option value="soon">Closing in 7 days</option><option value="expired">Expired</option><option value="all">All</option></select>
<select id="so"><option>Source</option></select></div></header>
<main id="list"></main>
<script>
const $=id=>document.getElementById(id);let T=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days=d=>d?Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5):null;
function render(){
  const q=$('q').value.toLowerCase(),st=$('st').value,so=$('so').value;
  const r=T.filter(t=>(!q||t.title.toLowerCase().includes(q))&&(so==='Source'||t.source===so)&&(
    st==='all'||(st==='new'&&t.is_new)||(st==='expired'&&t.status==='expired')||
    (st==='soon'&&t.closing&&days(t.closing)>=0&&days(t.closing)<=7)||(st===''&&['open'].includes(t.status))))
   .sort((a,b)=>(a.closing||'9999').localeCompare(b.closing||'9999'));
  $('list').innerHTML=r.length?r.map(t=>{const d=days(t.closing);
   return `<div class="card"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>
   <div class="meta">${t.is_new?'<span class="tag">NEW</span>':''}${d!==null&&d>=0&&d<=7?`<span class="tag s">closes in ${d}d</span>`:''}
   <span>${esc(t.source)}</span><span>${t.closing?'Closes '+esc(t.closing):'Closing date: see notice'}</span></div></div>`}).join('')
   :'<p class="sub">No tenders match.</p>';
}
fetch('tenders.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
  T=Object.values(j.tenders);
  $('upd').textContent=`${T.filter(t=>t.status==='open').length} open · last checked ${new Date(j.updated).toLocaleString()}`;
  [...new Set(T.map(t=>t.source))].forEach(s=>$('so').add(new Option(s,s)));render();
}).catch(()=>{$('upd').textContent='No data yet — run scraper.py to create tenders.json';});
['input','change'].forEach(e=>document.addEventListener(e,render));
</script></body></html>
