name: Update tenders
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python scraper.py
      - run: |
          git config user.name "tender-bot"; git config user.email "bot@users.noreply.github.com"
          git add tenders.json; git commit -m "Update tenders" || exit 0; git push
